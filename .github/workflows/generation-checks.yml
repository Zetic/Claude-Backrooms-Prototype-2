name: Generation checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  generation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify generation and UI controller
        run: node tests/run-all.js
